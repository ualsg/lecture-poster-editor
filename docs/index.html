<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit and export Urban Analytics Lab lecture posters.">
  <title>Lecture Poster Editor · Urban Analytics Lab</title>
  <link rel="stylesheet" href="styles.css">
  <style id="paper-style"></style>
  <script defer src="artwork.js"></script>
  <script defer src="templates.js"></script>
  <script defer src="layout.js"></script>
  <script defer src="pdf.js"></script>
  <script defer src="editor.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="1" y="1" width="34" height="34" rx="9" fill="#244d44"/>
        <path d="M10 10h16v16H10zM10 14h16m-11 5h6m-6 3h9" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><h1>Lecture Poster Editor</h1><p>Urban Analytics Lab</p></div>
    </div>
    <div class="downloads" aria-label="Export poster">
      <button id="download" class="download secondary" type="button">Download SVG</button>
      <button id="download-pdf" class="download" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Download PDF</span>
      </button>
    </div>
  </header>
  <main class="editor">
    <aside class="sidebar" aria-label="Poster settings">
      <div class="sidebar-header">
        <h2>Template</h2>
        <div id="templates" class="template-buttons" aria-label="Speaker count">
          <button type="button" data-template="1" aria-pressed="true">1 speaker</button>
          <button type="button" data-template="2" aria-pressed="false">2 speakers</button>
          <button type="button" data-template="3" aria-pressed="false">3 speakers</button>
        </div>
        <nav id="tabs" class="tabs" aria-label="Editing controls">
          <button type="button" data-panel="content" aria-pressed="true">Content</button>
          <button type="button" data-panel="layout" aria-pressed="false">Layout</button>
        </nav>
      </div>
      <div id="fields" class="fields"></div>
      <div class="sidebar-footer">
        <span id="save-status">Saved on this device</span>
        <button id="reset" class="quiet" type="button">Restore template</button>
      </div>
    </aside>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-bar">
        <h2 id="preview-title">Poster preview</h2>
        <span id="page-size" aria-live="polite"></span>
      </div>
      <p id="export-status" class="overflow" role="status" hidden></p>
      <p id="overflow" class="overflow" role="status" hidden></p>
      <div id="poster" class="poster"></div>
    </section>
  </main>
  <noscript>Enable JavaScript to edit and download your poster.</noscript>
</body>
</html>
